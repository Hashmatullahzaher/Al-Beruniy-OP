name: Import documentation package

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  import-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract documentation package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/pack.b64.part-* > /tmp/pack.b64
          base64 -d /tmp/pack.b64 > /tmp/alberuniy-docs.txz
          tar -xJf /tmp/alberuniy-docs.txz -C .

      - name: Commit imported documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: import AL-BERUNIY documentation and blueprint package"
          git push
